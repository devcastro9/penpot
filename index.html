<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142D4E">
  <meta name="description" content="Explora negocios locales en Sucre, compara opciones y contacta directamente.">
  <title>GuiaCofre — Descubre lo mejor cerca de ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }, colors: { brand: '#146EF5', navy: '#142D4E', ink: '#172B4D', muted: '#64748B', line: '#E2E8F0', surface: '#F8FAFC' }, boxShadow: { soft: '0 6px 24px rgba(20,45,78,.065)', float: '0 16px 48px rgba(20,45,78,.17)' } } } };</script>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="./bolivianegocios.css">
</head>

<body>
  <header
    class="relative z-[1200] flex flex-wrap items-center gap-3 border-b border-[#253d5e] bg-navy px-4 py-3 text-white shadow-sm md:h-[76px] md:flex-nowrap md:px-5 xl:px-7">
    <a href="#" id="brand" class="flex shrink-0 items-center gap-2.5" aria-label="GuiaCofre, volver al inicio">
      <span
        class="grid h-10 w-10 place-items-center rounded-[13px] bg-gradient-to-br from-[#45a9ff] to-[#146EF5] shadow-lg"><i
          data-lucide="map-pin" class="icon-lg"></i></span>
      <span class="text-[17px] font-extrabold tracking-[-.7px]">Guia<span class="text-[#8ec6ff]">Cofre</span></span>
    </a>
    <div class="ml-auto flex items-center gap-2">
      <button id="loginButton" type="button" disabled title="Inicio de sesión: próximamente"
        class="btn h-10 border border-white/30 px-3 text-white opacity-70"
        aria-label="Iniciar sesión (próximamente)">Iniciar sesión</button>
      <button id="registerButton" type="button" disabled title="Registro de usuarios: próximamente"
        class="btn h-10 bg-white px-3 text-navy opacity-70" aria-label="Registrarse (próximamente)">Registrarse</button>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="openFiltersTablet" class="btn hidden border border-white/20 bg-white/10 text-white hover:bg-white/20"
        type="button"><i data-lucide="sliders-horizontal" class="icon"></i>Filtros</button>
      <button id="mobileFilters" class="btn hidden border border-white/20 bg-white/10 px-3 text-white" type="button"
        aria-label="Abrir filtros"><i data-lucide="sliders-horizontal" class="icon"></i></button>
      <button id="favoritesOnly" type="button" aria-pressed="false" title="Ver favoritos"
        class="grid h-10 w-10 place-items-center rounded-xl text-white/85 hover:bg-white/10"
        aria-label="Mostrar solo favoritos"><i data-lucide="heart" class="icon-lg"></i></button>
      <div class="relative"><button id="menuButton" type="button" aria-expanded="false" aria-controls="menu"
          aria-label="Abrir menú"
          class="grid h-10 w-10 place-items-center rounded-xl text-white/85 hover:bg-white/10"><i data-lucide="menu"
            class="icon-lg"></i></button>
        <div id="menu" hidden
          class="absolute right-0 top-12 z-[2000] w-56 rounded-xl border border-line bg-white p-2 text-ink shadow-float">
          <button data-action="reset"
            class="flex w-full items-center gap-2 rounded-lg px-3 py-3 text-left text-xs hover:bg-surface"><i
              data-lucide="rotate-ccw" class="icon-sm"></i>Reiniciar exploración</button>
          <button data-action="about"
            class="flex w-full items-center gap-2 rounded-lg px-3 py-3 text-left text-xs hover:bg-surface"><i
              data-lucide="info" class="icon-sm"></i>Sobre esta demostración</button>
        </div>
      </div>
    </div>
  </header>
  <div id="mobileSwitch"
    class="relative z-[900] hidden h-[51px] items-center justify-center gap-1 border-b border-line bg-white p-1.5 md:hidden">
    <button id="mapMode"
      class="flex h-9 flex-1 items-center justify-center gap-2 rounded-lg bg-[#eaf2ff] text-xs font-bold text-brand"
      aria-pressed="true"><i data-lucide="map" class="icon-sm"></i>Mapa</button>
    <button id="listMode"
      class="flex h-9 flex-1 items-center justify-center gap-2 rounded-lg text-xs font-bold text-muted"
      aria-pressed="false"><i data-lucide="list" class="icon-sm"></i>Lista <span id="mobileCount"></span></button>
  </div>
  <div class="app-grid" id="appGrid">
    <aside id="desktopFilters" class="pane scroll-slim border-r border-line bg-white px-5 py-5"
      aria-label="Filtros de negocios">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-[17px] font-extrabold tracking-tight">Filtros</h2><button
          class="clearFilters text-xs font-semibold text-brand hover:underline">Limpiar todo</button>
      </div>
      <div id="filterContent"></div>
      <div class="sticky bottom-0 -mx-5 mt-6 flex gap-3 border-t border-line bg-white px-5 py-4">
        <button class="clearFilters btn btn-secondary flex-1" type="button">Limpiar</button>
        <button class="applyFilters btn btn-primary flex-[2]" type="button">Ver resultados</button>
      </div>
    </aside>
    <section class="pane results-pane scroll-slim border-r border-line bg-surface" aria-label="Resultados de negocios"
      id="resultsPane">
      <div class="sticky top-0 z-20 border-b border-line bg-white/95 px-4 pb-3 pt-4 backdrop-blur-sm">
        <div class="flex items-center justify-between gap-2">
          <div>
            <h1 class="text-[16px] font-extrabold tracking-tight">Explora negocios</h1>
            <p class="mt-1 text-[11px] text-muted" id="resultCount" role="status" aria-live="polite">Cargando
              resultados…</p>
          </div>
        </div>
        <div id="activeChips" class="mt-3 flex flex-wrap gap-1.5" aria-label="Filtros activos"></div>
      </div>
      <div id="results" class="space-y-3 p-3.5" aria-live="polite"></div>
      <p class="px-5 pb-5 text-[10px] leading-4 text-slate-400">Datos de negocios ilustrativos. Los horarios, distancias
        y reseñas no se verifican en tiempo real.</p>
    </section>
    <main class="map-pane" id="mapPane" aria-label="Mapa interactivo de negocios">
      <div id="map" aria-label="Mapa de negocios" tabindex="0"></div>
      <div id="mapChips"
        class="pointer-events-none absolute left-4 right-16 top-4 z-[550] flex gap-2 overflow-x-auto pb-2 scroll-slim">
        <div id="categoryChips" class="pointer-events-auto flex gap-2"></div>
      </div>
      <button id="locate"
        class="absolute bottom-[36px] right-4 z-[600] grid h-11 w-11 place-items-center rounded-xl border border-line bg-white text-ink shadow-soft hover:text-brand max-md:bottom-[205px]"
        title="Usar mi ubicación" aria-label="Usar mi ubicación" type="button"><i data-lucide="locate-fixed"
          class="icon-lg"></i></button>
      <div id="mobileCards" hidden
        class="absolute bottom-5 left-0 right-0 z-[610] gap-3 overflow-x-auto px-4 pb-2 snap-x snap-mandatory scroll-slim">
      </div>
      <div id="mapNotice"
        class="pointer-events-none absolute bottom-5 left-4 z-[500] hidden max-w-[260px] rounded-xl bg-white/95 px-3 py-2 text-xs font-semibold text-muted shadow-soft md:block">
        Selecciona un marcador para ver su ficha</div>
    </main>
  </div>
  <div id="overlay" hidden class="fixed inset-0 z-[1900] bg-[#142D4E]/45 backdrop-blur-[2px]"></div>
  <aside id="filterDrawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle"
    class="fixed inset-x-0 bottom-0 z-[2000] flex max-h-[88dvh] flex-col rounded-t-[22px] bg-white shadow-float md:inset-x-auto md:bottom-0 md:right-0 md:top-0 md:max-h-none md:w-[360px] md:rounded-none">
    <div class="mx-auto mt-2 h-1 w-10 rounded-full bg-slate-200 md:hidden"></div>
    <div class="flex items-center justify-between border-b border-line px-5 py-4">
      <h2 id="drawerTitle" class="text-lg font-extrabold">Filtrar negocios</h2><button id="closeDrawer"
        type="button" class="grid h-10 w-10 place-items-center rounded-lg hover:bg-surface"
        aria-label="Cerrar filtros"><i data-lucide="x" class="icon-lg"></i></button>
    </div>
    <div id="drawerContent" class="scroll-slim flex-1 overflow-auto px-5 py-2"></div>
    <div class="flex gap-3 border-t border-line bg-white p-4"><button class="clearFilters btn btn-secondary flex-1"
        type="button">Limpiar</button><button id="applyFilters" class="applyFilters btn btn-primary flex-[2]"
        type="button">Ver resultados</button></div>
  </aside>
  <div id="infoDialog" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle"
    class="fixed left-1/2 top-1/2 z-[2100] w-[min(92vw,440px)] -translate-x-1/2 -translate-y-1/2 rounded-[20px] bg-white p-6 shadow-float">
    <div class="flex items-center justify-between">
      <h2 id="infoTitle" class="text-lg font-extrabold">GuiaCofre · Demo</h2><button id="closeInfo"
        class="grid h-9 w-9 place-items-center rounded-lg hover:bg-surface" aria-label="Cerrar" type="button"><i
          data-lucide="x" class="icon"></i></button>
    </div>
    <p id="infoMessage" class="mt-3 text-[13px] leading-6 text-muted"></p><button id="okInfo"
      class="btn btn-primary mt-5 w-full" type="button">Entendido</button>
  </div>
  <div id="toast" hidden role="status" aria-live="polite"
    class="fixed bottom-6 left-1/2 z-[2200] -translate-x-1/2 rounded-xl bg-navy px-5 py-3 text-xs font-semibold text-white shadow-float">
  </div>
  <script defer src="./bolivianegocios.js"></script>
</body>

</html>
